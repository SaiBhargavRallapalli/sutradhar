name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege: the workflow only ever needs to read the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (py${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The planning core is portable; verify all supported interpreters and
        # operating systems instead of merely asserting compatibility.
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12"]
        include:
          - os: macos-latest
            python-version: "3.12"
          - os: windows-latest
            python-version: "3.12"

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dev tooling
        run: python -m pip install --disable-pip-version-check -e ".[dev]"

      - name: Run tests
        run: python -m pytest --cov=sutradhar --cov-report=term-missing --cov-report=xml

      - name: Upload coverage
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage
          path: coverage.xml

  lint:
    name: lint & typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dev tooling
        run: python -m pip install --disable-pip-version-check -e ".[dev]"

      - name: Ruff (lint)
        run: python -m ruff check src tests

      - name: Ruff (format check)
        run: python -m ruff format --check src tests

      - name: mypy (strict)
        run: python -m mypy

  smoke:
    name: smoke test the CLI and server
    runs-on: ubuntu-latest
    needs: [test, lint]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: python -m pip install --disable-pip-version-check -e .

      # No API key or network: this proves the offline planning claim.
      - name: Generate a demo plan
        run: python -m sutradhar.cli demo --no-color --offline --out out

      - name: Check the exported artefacts are non-empty
        shell: bash
        run: |
          set -euo pipefail
          ls -la out
          for f in out/*; do
            test -s "$f" || { echo "$f is empty"; exit 1; }
          done
          # The budget must reconcile: unallocated is zero by construction.
          python - <<'PY'
          import json, pathlib, sys
          plan = json.loads(next(pathlib.Path("out").glob("*.json")).read_text())
          budget = plan["budget"]
          assert budget["unallocated_minor"] == 0, budget
          total = sum(line["amount_minor"] for line in budget["lines"])
          assert total == budget["spendable_minor"], (total, budget["spendable_minor"])
          print("budget reconciles exactly:", total, "minor units")
          PY

      - name: Start the web server and hit the API
        shell: bash
        run: |
          set -euo pipefail
          python -m sutradhar.cli web --port 8787 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          # Wait for the port rather than sleeping a fixed time.
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8787/api/health >/dev/null 2>&1; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8787/api/health | grep -Eq '"ok":[[:space:]]*true'
          curl -fsS -X POST http://127.0.0.1:8787/api/plan \
            -H 'Content-Type: application/json' \
            -d '{"event_type":"wedding","event_date":"2027-06-06","guest_count":150,"budget":"800000","currency":"INR"}' \
            | grep -Eq '"ok":[[:space:]]*true'
          echo "server smoke test passed"

      - name: Check the web UI is served with security headers
        shell: bash
        run: |
          set -euo pipefail
          python -m sutradhar.cli web --port 8788 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8788/api/health >/dev/null 2>&1; then break; fi
            sleep 1
          done
          HEADERS=$(curl -fsSI http://127.0.0.1:8788/)
          echo "$HEADERS"
          echo "$HEADERS" | grep -qi 'x-content-type-options: nosniff'
          echo "$HEADERS" | grep -qi 'x-frame-options: DENY'
          echo "$HEADERS" | grep -qi 'content-security-policy'
          # Path traversal must be refused.
          CODE=$(curl -s -o /dev/null -w '%{http_code}' --path-as-is http://127.0.0.1:8788/../pyproject.toml)
          test "$CODE" = "403" -o "$CODE" = "404" || { echo "traversal returned $CODE"; exit 1; }
          echo "security header checks passed"

  size:
    name: repository size budget
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Enforce the <10 MB repository budget
        shell: bash
        run: |
          set -euo pipefail
          SIZE=$(du -sk . | cut -f1)
          echo "working tree: ${SIZE} KB"
          # 10 MB == 10240 KB; leave headroom for .git.
          if [ "$SIZE" -gt 8192 ]; then
            echo "Repository is ${SIZE} KB, over the 8 MB soft budget."
            exit 1
          fi
          ASSETS=$(du -ck web/* | awk '/total$/ {print $1}')
          echo "web assets: ${ASSETS} KB"
          test "$ASSETS" -le 50 || { echo "Web assets exceed the 50 KB budget."; exit 1; }

  secrets:
    name: no secrets in git history
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan complete history with Gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
