[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "sutradhar"
version = "1.0.0"
description = "Sutradhar - a GenAI celebration & event planning co-pilot for weddings, birthdays and community events."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Sutradhar Contributors" }]
keywords = ["genai", "event-planning", "wedding", "birthday", "community", "budget", "timeline"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Scheduling",
]

# The planning core remains standard-library-only. Waitress is the single,
# exact-pinned deployment dependency: it provides a production WSGI server
# with bounded channels and graceful shutdown on every supported OS.
dependencies = ["waitress==3.0.2"]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "ruff==0.17.2",
    "mypy==2.4.0",
    "types-waitress==3.0.1.20260724",
]

[project.scripts]
sutradhar = "sutradhar.cli:main"

[project.urls]
Homepage = "https://sutradhar-it6j.onrender.com"
Documentation = "https://github.com/SaiBhargavRallapalli/sutradhar#readme"
Issues = "https://github.com/SaiBhargavRallapalli/sutradhar/issues"
Source = "https://github.com/SaiBhargavRallapalli/sutradhar"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sutradhar = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "slow: tests that exercise the LLM repair loop end-to-end",
]

[tool.coverage.run]
branch = true
source = ["sutradhar"]

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RUF"]
ignore = [
    "E501", # line length is enforced by the formatter
    "RUF001", # ambiguous unicode - we deliberately use Devanagari in docstrings
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["SIM117"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_unused_ignores = true
disallow_untyped_defs = true
packages = ["sutradhar"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
