# Render Blueprint for Sutradhar — one-click deploy.
# Dashboard: New + -> Blueprint -> select this repo. Render does the rest.
services:
  - type: web
    name: sutradhar
    runtime: python
    region: ohio # US Central — closest to Groq + Gemini serving
    plan: free
    buildCommand: pip install -r requirements.txt
    # $PORT is injected by Render; 0.0.0.0 is required (localhost is unreachable).
    startCommand: PYTHONPATH=src python3 -m sutradhar.cli web --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    # Live-model prose via Groq. Without SUTRADHAR_OPENAI_API_KEY the app
    # runs fully offline on the curated catalogue — nothing else to change.
    envVars:
      - key: SUTRADHAR_PROVIDER
        value: openai
      - key: SUTRADHAR_OPENAI_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: SUTRADHAR_OPENAI_MODEL
        value: openai/gpt-oss-20b
      - key: SUTRADHAR_OPENAI_API_KEY
        sync: false
      - key: SUTRADHAR_GEMINI_API_KEY
        sync: false
